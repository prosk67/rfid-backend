<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFID Admin Panel</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 2rem; background:#f5f5f5;}
    .container {max-width: 1200px; margin: 0 auto;}
    h1 {text-align: center; margin-bottom: 1rem;}
    .section {background:#fff; margin-bottom: 2rem; border-radius: 8px; overflow: hidden;}
    .section h2 {background:#0066cc; color:#fff; margin:0; padding: 0.75rem; margin:-1px -1px 0;}
    .content {padding: 1rem;}
    table {width:100%; border-collapse: collapse; margin-top: 0.5rem;}
    th, td {border: 1px solid #ddd; padding: 0.5rem; text-align: left;}
    th {background:#f0f0f0;}
    .btn {display:inline-block; background:#0066cc; color:#fff; padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer; margin-right:0.5rem;}
    .btn:hover {background:#0055aa;}
    .empty {color:#888; font-style:italic;}
  </style>
</head>
<body>
  <div class="container">
    <h1>RFID Admin Panel</h1>

    <div class="section">
      <h2>Enrolled Users</h2>
      <div class="content">
        <button class="btn" onclick="loadUsers()">Refresh</button>
        <table id="usersTable"><thead><tr><th>UID</th><th>Name</th><th>Active</th><th>Created At</th></tr></thead><tbody class="empty">Loading…</tbody></table>
      </div>
    </div>

    <div class="section">
      <h2>Access Log (Last 50)</h2>
      <div class="content">
        <button class="btn" onclick="loadAccessLog()">Refresh</button>
        <table id="accessTable"><thead><tr><th>UID</th><th>Status</th><th>Name</th><th>Timestamp</th></tr></thead><tbody class="empty">Loading…</tbody></table>
      </div>
    </div>

    <div class="section">
      <h2>Intrusion Log (Last 50)</h2>
      <div class="content">
        <button class="btn" onclick="loadIntrusionLog()">Refresh</button>
        <table id="intrusionTable"><thead><tr><th>Sensor</th><th>Timestamp</th></tr></thead><tbody class="empty">Loading…</tbody></table>
      </div>
    </div>
  </div>

  <script>
    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Network error');
      return res.json();
    }

    async function loadUsers() {
      const data = await fetchJson('/api/users');
      const tbody = document.querySelector('#usersTable tbody');
      if (!data.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">No users enrolled</td></tr>'; return; }
      tbody.innerHTML = data.map(u => `<tr><td>${u.uid}</td><td>${u.name || ''}</td><td>${u.active !== false ? 'yes' : 'no'}</td><td>${u.created_at ? new Date(u.created_at).toLocaleString() : ''}</td></tr>`).join('');
    }

    async function loadAccessLog() {
      const data = await fetchJson('/api/logs/access');
      const tbody = document.querySelector('#accessTable tbody');
      if (!data.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">No access events</td></tr>'; return; }
      tbody.innerHTML = data.map(e => `<tr><td>${e.uid}</td><td>${e.status}</td><td>${e.name || ''}</td><td>${new Date(e.timestamp).toLocaleString()}</td></tr>`).join('');
    }

    async function loadIntrusionLog() {
      const data = await fetchJson('/api/logs/intrusion');
      const tbody = document.querySelector('#intrusionTable tbody');
      if (!data.length) { tbody.innerHTML = '<tr><td colspan="2" class="empty">No intrusion events</td></tr>'; return; }
      tbody.innerHTML = data.map(e => `<tr><td>${e.sensor}</td><td>${new Date(e.timestamp).toLocaleString()}</td></tr>`).join('');
    }

    loadUsers(); loadAccessLog(); loadIntrusionLog();
  </script>
</body>
</html>
